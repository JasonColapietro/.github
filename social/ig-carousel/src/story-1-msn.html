<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="size" content="1080x1920">
<title>Story — as reported on MSN</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@300..700&amp;family=Geist+Mono:wght@400..600&amp;display=swap">
<style>
body { margin: 0; background: #f7f6fb; font-family: "Geist", ui-sans-serif, system-ui, sans-serif; }
a { color: #6d28d9; } a:hover { color: #7c3aed; }
</style>
<style>
  html, body { margin: 0; padding: 0; }

</style>

<body>
<div style="position: relative; width: 1080px; height: 1920px; box-sizing: border-box; overflow: hidden; background: #f7f6fb;">

  <svg width="1080" height="1920" viewBox="0 0 1080 1920" style="position: absolute; top: 0; left: 0;" aria-hidden="true" focusable="false">
    <defs>
      <pattern id="St1Grid" width="60" height="60" patternUnits="userSpaceOnUse">
        <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#14121f" stroke-opacity="0.055" stroke-width="1"></path>
      </pattern>
      <radialGradient id="St1Glow" cx="50%" cy="30%" r="60%">
        <stop offset="0%" stop-color="#6d28d9" stop-opacity="0.10"></stop>
        <stop offset="100%" stop-color="#6d28d9" stop-opacity="0"></stop>
      </radialGradient>
    </defs>
    <rect x="0" y="0" width="1080" height="1920" fill="url(#St1Grid)"></rect>
    <rect x="0" y="0" width="1080" height="1920" fill="url(#St1Glow)"></rect>
  </svg>

  <div style="position: relative; width: 1080px; height: 1920px; box-sizing: border-box; padding: 270px 80px 300px 80px; display: flex; flex-direction: column;">

    <span style="flex-grow: 1;"></span>

      <span style="display: inline-flex; align-items: center; padding: 10px 18px; border-radius: 6px; background: #242424;">
        <img src="assets/msn-logo.png" alt="MSN" style="height: 38px; width: auto; display: block;">
      </span>
    </div>

    <h1 style="margin: 34px 0 0 0; font-family: 'Instrument Serif', Georgia, serif; font-size: 100px; line-height: 0.96; color: #14121f; font-weight: 400; letter-spacing: -0.015em;">Suede AI opens<br>its SEO cohort</h1>

    <div style="margin: 30px 0 0 0; width: 100px; height: 4px; background: #9f101a;"></div>

    <img src="assets/hero.png" alt="Jason Colapietro, founder of Suede AI" style="margin-top: 40px; width: 920px; height: 486px; object-fit: cover; display: block; border-radius: 6px;">

    <p style="margin: 30px 0 0 0; font-size: 29px; line-height: 1.42; color: #3f3a52; font-style: italic; font-weight: 300;">&ldquo;The five-business program pairs search visibility and ranking monitoring with optional AI implementation and staff training.&rdquo;</p>

    <div style="margin-top: 48px; display: flex; align-items: center; gap: 14px; align-self: flex-start; padding: 16px 28px; border: 1px solid rgba(109, 40, 217, 0.50); border-radius: 999px; background: #ffffff;">
      <span style="width: 11px; height: 11px; border-radius: 999px; background: #6d28d9; display: inline-block;"></span>
      <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 23px; letter-spacing: 0.16em; color: #14121f; font-weight: 500;">3 OF 5 SEATS OPEN</span>
    </div>

    <p style="margin: 26px 0 0 0; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 22px; letter-spacing: 0.14em; color: #5b5670;">suedeai.org</p>

    <span style="flex-grow: 1;"></span>

  </div>
